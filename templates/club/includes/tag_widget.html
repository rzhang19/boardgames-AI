{% load club_tags %}

{# Usage: {% include "club/includes/tag_widget.html" with tag_type="game" %} or tag_type="event" #}

<div class="tag-widget" data-tag-type="{{ tag_type }}">
    <label>Tags <span class="tag-count-label">(max 5)</span></label>
    <div class="tag-pill-container" id="tag-pills-{{ tag_type }}">
        {% for tag in initial_tags %}
        <span class="tag-pill" data-tag-id="{{ tag.id }}">{{ tag.name }}<button type="button" class="tag-pill-remove" aria-label="Remove tag">&times;</button></span>
        {% endfor %}
    </div>
    <div class="tag-input-row">
        <input type="text" id="tag-search-{{ tag_type }}" class="tag-search-input" placeholder="Search tags..." autocomplete="off">
        <div id="tag-dropdown-{{ tag_type }}" class="tag-dropdown" style="display:none;"></div>
    </div>
    <div id="tag-toast-{{ tag_type }}" class="tag-inline-toast" style="display:none;"></div>
</div>

<script>
(function() {
    var tagType = '{{ tag_type }}';
    var isSuperuser = {% if request.user.is_superuser %}true{% else %}false{% endif %};
    var isSiteAdmin = {% if request.user.is_site_admin %}true{% else %}false{% endif %};
    var isAdmin = isSuperuser || isSiteAdmin;
    var isVerified = {% if request.user.email_verified %}true{% else %}false{% endif %};
    var canRequest = !isAdmin && isVerified;
    var pillsContainer = document.getElementById('tag-pills-' + tagType);
    var searchInput = document.getElementById('tag-search-' + tagType);
    var dropdown = document.getElementById('tag-dropdown-' + tagType);
    var toastEl = document.getElementById('tag-toast-' + tagType);
    var hiddenField = document.getElementById('id_tag_ids');
    var MAX_TAGS = 5;
    var debounceTimer = null;

    var searchUrl = tagType === 'game' ? '{% url "game_tag_search" %}' : '{% url "event_tag_search" %}';
    var requestUrl = '{% url "tag_request_submit" %}';
    var addUrl = isAdmin ? (tagType === 'game' ? '{% url "admin_tag_add_game" %}' : '{% url "admin_tag_add_event" %}') : '';

    function getCSRF() {
        var el = document.querySelector('[name=csrfmiddlewaretoken]');
        return el ? el.value : '';
    }

    function getSelectedIds() {
        var pills = pillsContainer.querySelectorAll('.tag-pill');
        var ids = [];
        pills.forEach(function(p) { ids.push(p.getAttribute('data-tag-id')); });
        return ids;
    }

    function syncHidden() {
        if (hiddenField) {
            hiddenField.value = getSelectedIds().join(',');
        }
    }

    function addPill(id, name) {
        if (getSelectedIds().length >= MAX_TAGS) return;
        if (getSelectedIds().indexOf(String(id)) !== -1) return;
        var span = document.createElement('span');
        span.className = 'tag-pill';
        span.setAttribute('data-tag-id', id);
        span.textContent = name + ' ';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tag-pill-remove';
        btn.setAttribute('aria-label', 'Remove tag');
        btn.textContent = '\u00d7';
        btn.addEventListener('click', function() {
            span.remove();
            syncHidden();
        });
        span.appendChild(btn);
        pillsContainer.appendChild(span);
        syncHidden();
    }

    function showToast(msg, isError) {
        toastEl.textContent = msg;
        toastEl.className = 'tag-inline-toast' + (isError ? ' tag-toast-error' : ' tag-toast-success');
        toastEl.style.display = 'block';
        setTimeout(function() { toastEl.style.display = 'none'; }, 3000);
    }

    function renderDropdown(tags, query) {
        dropdown.innerHTML = '';
        if (tags.length === 0) {
            if (query.length >= 2 && canRequest && query.length <= 25) {
                var reqBtn = document.createElement('button');
                reqBtn.type = 'button';
                reqBtn.className = 'tag-dropdown-item tag-request-btn';
                reqBtn.textContent = 'Request "' + query + '"';
                reqBtn.addEventListener('click', function() {
                    submitRequest(query);
                });
                dropdown.appendChild(reqBtn);
            } else if (query.length >= 2 && isAdmin && query.length <= 25) {
                var addBtn = document.createElement('button');
                addBtn.type = 'button';
                addBtn.className = 'tag-dropdown-item tag-add-btn';
                addBtn.textContent = 'Add "' + query + '"';
                addBtn.addEventListener('click', function() {
                    addNewTag(query);
                });
                dropdown.appendChild(addBtn);
            } else {
                var empty = document.createElement('div');
                empty.className = 'tag-dropdown-empty';
                empty.textContent = query.length === 0 ? 'No tags available' : 'No tags found';
                dropdown.appendChild(empty);
            }
        } else {
            tags.forEach(function(t) {
                var item = document.createElement('div');
                item.className = 'tag-dropdown-item';
                var nameSpan = document.createElement('span');
                nameSpan.textContent = t.name;
                item.appendChild(nameSpan);
                if (t.count !== undefined) {
                    var countSpan = document.createElement('span');
                    countSpan.className = 'tag-dropdown-count';
                    countSpan.textContent = ' (' + t.count + ')';
                    item.appendChild(countSpan);
                }
                item.addEventListener('click', function() {
                    addPill(t.id, t.name);
                    searchInput.value = '';
                    dropdown.style.display = 'none';
                });
                dropdown.appendChild(item);
            });
            if (query.length >= 2 && canRequest && query.length <= 25) {
                var reqBtn2 = document.createElement('button');
                reqBtn2.type = 'button';
                reqBtn2.className = 'tag-dropdown-item tag-request-btn';
                reqBtn2.textContent = 'Request "' + query + '"';
                reqBtn2.addEventListener('click', function() {
                    submitRequest(query);
                });
                dropdown.appendChild(reqBtn2);
            } else if (query.length >= 2 && isAdmin && query.length <= 25) {
                var addBtn2 = document.createElement('button');
                addBtn2.type = 'button';
                addBtn2.className = 'tag-dropdown-item tag-add-btn';
                addBtn2.textContent = 'Add "' + query + '"';
                addBtn2.addEventListener('click', function() {
                    addNewTag(query);
                });
                dropdown.appendChild(addBtn2);
            }
        }
        dropdown.style.display = 'block';
    }

    function performSearch() {
        var q = searchInput.value.trim().toLowerCase();
        fetch(searchUrl + '?q=' + encodeURIComponent(q))
            .then(function(r) { return r.json(); })
            .then(function(tags) {
                var selected = getSelectedIds();
                var filtered = tags.filter(function(t) { return selected.indexOf(String(t.id)) === -1; });
                renderDropdown(filtered, q);
            })
            .catch(function() {
                dropdown.innerHTML = '<div class="tag-dropdown-empty">Search failed</div>';
                dropdown.style.display = 'block';
            });
    }

    function submitRequest(name) {
        fetch(requestUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCSRF()},
            body: JSON.stringify({name: name, tag_type: tagType})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                showToast(data.error, true);
            } else {
                showToast(data.message || 'Tag requested!', false);
            }
            dropdown.style.display = 'none';
            searchInput.value = '';
        })
        .catch(function() { showToast('Request failed', true); });
    }

    function addNewTag(name) {
        fetch(addUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCSRF()},
            body: JSON.stringify({name: name})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                showToast(data.error, true);
            } else {
                addPill(data.id, data.name);
                showToast('Tag added!', false);
            }
            dropdown.style.display = 'none';
            searchInput.value = '';
        })
        .catch(function() { showToast('Failed to add tag', true); });
    }

    searchInput.addEventListener('input', function() {
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(performSearch, 300);
    });

    searchInput.addEventListener('focus', function() {
        performSearch();
    });

    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            dropdown.style.display = 'none';
        }
    });

    document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });

    pillsContainer.addEventListener('click', function(e) {
        if (e.target.classList.contains('tag-pill-remove')) {
            e.target.parentElement.remove();
            syncHidden();
        }
    });

    syncHidden();
})();
</script>

<style>
.tag-widget { margin-bottom: 1rem; }
.tag-widget > label { font-weight: 600; display: block; margin-bottom: 0.25rem; }
.tag-count-label { font-weight: 400; font-size: 0.85em; color: #666; }
.tag-pill-container { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.5rem; min-height: 1.6rem; }
.tag-pill {
    display: inline-flex; align-items: center; gap: 0.25rem;
    background: var(--bg-secondary, #e9ecef); color: var(--text-primary, #333);
    padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.85em;
}
.tag-pill-remove {
    background: none; border: none; cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 0 0.1rem;
    color: inherit; opacity: 0.6;
}
.tag-pill-remove:hover { opacity: 1; }
.tag-input-row { position: relative; }
.tag-search-input {
    width: 100%; max-width: 300px; padding: 0.35rem 0.5rem;
    border: 1px solid var(--border, #ccc); border-radius: 4px; font-size: 0.9em;
}
.tag-dropdown {
    position: absolute; top: 100%; left: 0; z-index: 100;
    background: var(--bg-primary, #fff); border: 1px solid var(--border, #ccc);
    border-radius: 4px; max-height: 200px; overflow-y: auto; min-width: 200px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.tag-dropdown-item {
    padding: 0.4rem 0.6rem; cursor: pointer; font-size: 0.9em;
}
.tag-dropdown-item:hover { background: var(--bg-hover, #f0f0f0); }
.tag-dropdown-empty { padding: 0.4rem 0.6rem; color: #999; font-size: 0.9em; }
.tag-request-btn, .tag-add-btn { color: var(--primary, #007bff); font-style: italic; }
.tag-dropdown-count { color: #888; font-size: 0.85em; }
.tag-inline-toast {
    margin-top: 0.35rem; padding: 0.35rem 0.6rem; border-radius: 4px; font-size: 0.85em;
}
.tag-toast-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
.tag-toast-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
</style>
