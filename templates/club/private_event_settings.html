{% extends "base.html" %}
{% load static %}

{% block title %}Event Settings - {{ event.title }}{% endblock %}

{% block content %}
<div class="unsaved-changes-banner" id="unsaved-banner">
    <span>You have unsaved changes</span>
    <button type="button" class="btn btn-primary" id="unsaved-save-btn">Save Settings</button>
</div>
<div class="card">
    <h2>Event Settings: {{ event.title }}</h2>
    <form method="post" data-unsaved-form>
        {% csrf_token %}
        {{ form.as_p }}
    </form>
</div>
<script src="{% static 'js/unsaved-changes.js' %}"></script>
{% endblock %}
