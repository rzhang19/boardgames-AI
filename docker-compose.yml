services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boardgameclub}
      POSTGRES_USER: ${POSTGRES_USER:-boardgameclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PLEASE_SET_POSTGRES_PASSWORD_IN_ENV}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  web:
    build: .
    env_file:
      - /opt/boardgames-secrets/.env
    depends_on:
      db:
        condition: service_started
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 8000), timeout=5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - frontend
    restart: unless-stopped

  staging-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-boardgameclub_staging}
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-boardgameclub}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-PLEASE_SET_STAGING_POSTGRES_PASSWORD_IN_ENV}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - staging-backend
    restart: unless-stopped

  staging-web:
    build: .
    env_file:
      - /opt/boardgames-secrets/.env.staging
    depends_on:
      staging-db:
        condition: service_started
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 8000), timeout=5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - staging-backend
      - frontend
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      STAGING_DOMAIN: ${STAGING_DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-tester}
      BASIC_AUTH_PASSWORD_HASH: ${BASIC_AUTH_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/app/media
    depends_on:
      web:
        condition: service_healthy
      staging-web:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped

  socket-proxy:
    image: tecnativa/docker-socket-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      EXEC: 1
      POST: 1
      BUILD: 1
      NETWORKS: 0
      VOLUMES: 0
      PLUGINS: 0
      AUTH: 0
      SECRETS: 0
      SERVICES: 1
      TASKS: 1
      SWARM: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-mgmt
    restart: unless-stopped

  runner:
    image: myoung34/github-runner:latest
    env_file:
      - /opt/boardgames-secrets/.env
    environment:
      REPO_URL: ${GITHUB_REPO_URL}
      RUNNER_NAME: ${RUNNER_NAME:-boardgames-runner}
      RUNNER_TOKEN: ${GITHUB_RUNNER_TOKEN}
      RUNNER_WORKDIR: /home/runner/work
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - .:${PROJECT_DIR:-/opt/boardgames}
      - runner_data:/home/runner
    depends_on:
      - socket-proxy
    networks:
      - docker-mgmt
    restart: unless-stopped

  telegram:
    build: ./telegram_bot
    env_file:
      - /opt/boardgames-secrets/.env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      PROJECT_DIR: ${PROJECT_DIR:-/opt/boardgames}
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - .:${PROJECT_DIR:-/opt/boardgames}
    depends_on:
      - socket-proxy
    networks:
      - docker-mgmt
    restart: unless-stopped

  scheduler:
    build: .
    env_file:
      - /opt/boardgames-secrets/.env
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for database..."
        python -c "
        import socket, time
        while True:
            try:
                s = socket.create_connection(('db', 5432), timeout=2)
                s.close()
                break
            except OSError:
                time.sleep(1)
        "
        echo "Scheduler started. Running cleanup_all every 12 hours."
        while true; do
          echo "$$(date -Iseconds) Running cleanup_all..."
          python manage.py cleanup_all 2>&1
          echo "$$(date -Iseconds) Sleeping 12 hours..."
          sleep 43200
        done
    depends_on:
      db:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  staging_postgres_data:
  caddy_data:
  caddy_config:
  runner_data:
  media_data:

networks:
  backend:
  staging-backend:
  frontend:
  docker-mgmt:
